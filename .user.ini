; .user.ini - PHP-FPM settings for Hostinger (LiteSpeed/PHP-FPM)
; Hostinger honors directives here (not the mod_php block in .htaccess).
; Paths are resolved relative to this .user.ini (the web root).

; --- Error handling ---
display_errors = Off
log_errors = On
error_log = logs/php-error.log
html_errors = Off

; --- Resource / upload limits (needed for admin image uploads) ---
upload_max_filesize = 32M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300